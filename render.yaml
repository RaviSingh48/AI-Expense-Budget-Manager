services:
  - type: web
    name: ai-expense-budget-manager
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -m alembic upgrade head || echo "WARNING: Alembic migration skipped — ensure DATABASE_URL is set in Render Dashboard environment variables"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # -----------------------------------------------------------------------
      # Required secrets — set these manually in the Render Dashboard.
      # These are marked sync:false so Render will NOT try to auto-populate them.
      # -----------------------------------------------------------------------
      - key: DATABASE_URL
        sync: false   # Value: your Render PostgreSQL Internal Database URL
      - key: SECRET_KEY
        sync: false   # Value: any 32+ char random string (e.g. openssl rand -hex 32)
      - key: GEMINI_API_KEY
        sync: false   # Value: your Google AI Studio API key
      # -----------------------------------------------------------------------
      # Optional — sensible production defaults baked into the YAML.
      # Override any of these in the Render Dashboard if needed.
      # -----------------------------------------------------------------------
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "False"
      - key: CHROMA_DB_DIR
        value: "./vector_store/chroma_db"
      - key: CHROMA_COLLECTION_NAME
        value: "expense_vectors"
